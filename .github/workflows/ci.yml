name: CI

on:
  push:
  pull_request:

# 工具链版本在这里固定，必须与 README「构建要求」和本地一致：
# - CMake：`import std` 的实验 GUID 只在 4.5 被识别，4.4 及以下直接 configure 失败；
# - clang-format：换行与对齐决策跨小版本会变，版本漂移会让同一份代码在两处报不同结果。
env:
  CMAKE_VERSION: 4.5.0
  CLANG_FORMAT_VERSION: 23.1.5

jobs:
  format:
    name: clang-format check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format ${{ env.CLANG_FORMAT_VERSION }}
        run: python3 -m pip install --break-system-packages "clang-format==${CLANG_FORMAT_VERSION}"
      - name: Check formatting
        run: |
          clang-format --version
          files=$(find src example test -type f \( -name '*.cppm' -o -name '*.cpp' \) -print)
          clang-format --dry-run --Werror $files

  # clang-tidy 暂不进入 CI：clang 23 尚未实现 P2996 静态反射（`^^T` / `std::meta::*`），
  # src/message.cppm 无法解析，而其余 TU 都要拿它的 BMI，tidy 拿不到可用编译单元。
  # 等 clang 支持反射后恢复本 job（配置见 .clang-tidy）。

  # 暂时只跑 GCC：Clang 的 C++26 模块/std 支持仍在追平，等其能过完整构建再回到矩阵。
  # 矩阵覆盖产物开关 YLOG_NO_EXCEPTIONS 的两侧；OFF 的构建内部还会用
  # YLOG_BUILD_NOEXC_TESTS 额外编一份无异常库，单次 ctest 同时跑两种模式。
  build-and-test:
    name: build & test (g++-16, YLOG_NO_EXCEPTIONS=${{ matrix.no_exceptions }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        no_exceptions: [OFF, ON]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y g++-16 ninja-build
      - name: Install CMake ${{ env.CMAKE_VERSION }}
        run: |
          curl -fsSL -o /tmp/cmake.tar.gz \
            "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz"
          sudo tar -xzf /tmp/cmake.tar.gz -C /opt
          echo "/opt/cmake-${CMAKE_VERSION}-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Configure
        run: |
          cmake --version
          cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=g++-16 -DYLOG_NO_EXCEPTIONS=${{ matrix.no_exceptions }} -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wconversion -pedantic -Werror"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
