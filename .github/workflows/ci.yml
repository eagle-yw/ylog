name: CI

on:
  push:
  pull_request:

# 所有作业都跑在 Arch 容器里，与本地开发环境同源（见 README「构建要求」）。
# 不用 ubuntu-24.04 的原因：它的 toolchain PPA 只提供 gcc-16 的 16.0.1 快照，
# 该版本读取聚合模块（`export module ylog;`）的 BMI 时报
# "failed to read compiled module: Bad file data"，所有 import ylog 的 TU 全部失败；
# 16.2 起才正常。Arch 提供 GCC 16.2.x。
jobs:
  format:
    name: clang-format check
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      # 容器里先装 git 才能 checkout；Arch 无 sudo，直接以 root 跑 pacman。
      - name: Install toolchain
        run: |
          pacman -Syu --noconfirm --quiet --needed archlinux-keyring
          pacman -S --noconfirm --quiet --needed clang git
          clang-format --version
      - uses: actions/checkout@v4
      - name: Check formatting
        run: |
          files=$(find src example test -type f \( -name '*.cppm' -o -name '*.cpp' \) -print)
          clang-format --dry-run --Werror $files

  # clang-tidy 暂不进入 CI：clang 23 尚未实现 P2996 静态反射（`^^T` / `std::meta::*`），
  # src/message.cppm 无法解析，而其余 TU 都要拿它的 BMI，tidy 拿不到可用编译单元。
  # 等 clang 支持反射后恢复本 job（配置见 .clang-tidy）。

  # 暂时只跑 GCC：Clang 的 C++26 模块/std 支持仍在追平，等其能过完整构建再回到矩阵。
  # 矩阵覆盖产物开关 YLOG_NO_EXCEPTIONS 的两侧；OFF 的构建内部还会用
  # YLOG_BUILD_NOEXC_TESTS 额外编一份无异常库，单次 ctest 同时跑两种模式。
  build-and-test:
    name: build & test (gcc 16.2, YLOG_NO_EXCEPTIONS=${{ matrix.no_exceptions }})
    runs-on: ubuntu-24.04
    container: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        no_exceptions: [OFF, ON]
    steps:
      - name: Install toolchain
        run: |
          pacman -Syu --noconfirm --quiet --needed archlinux-keyring
          pacman -S --noconfirm --quiet --needed gcc cmake ninja git
          g++ --version | head -1
          cmake --version | head -1
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Ninja -DYLOG_NO_EXCEPTIONS=${{ matrix.no_exceptions }} -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wconversion -pedantic -Werror"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
